<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeXglass</title>
  <meta name="description" content="A LaTeX viewer that renders .tex files like a Markdown preview: math, sections and numbered theorems with working references.">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="src/tikz.js"></script>
  <script defer src="src/texglass.js"></script>
  <script defer src="src/diagrams.js"></script>
  <script defer src="src/editor.js"></script>
  <script defer src="src/arxiv.js"></script>
  <script defer src="src/github.js"></script>
  <script defer src="src/openai-math.js"></script>
  <script defer src="src/find.js"></script>
  <script defer src="src/export.js"></script>
  <script defer src="src/zoom.js"></script>
  <script defer src="src/scroll.js"></script>
  <script defer src="src/copytex.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand">T<sub>e</sub>Xglass</div>
    <div class="mode-switch" role="group" aria-label="Mode">
      <button id="mode-preview" type="button" aria-pressed="true" title="Read the rendered document (Ctrl+E)">Preview</button>
      <button id="mode-edit" type="button" aria-pressed="false" title="Click any part of the document to edit it (Ctrl+E)">Edit</button>
      <button id="mode-split" type="button" aria-pressed="false" title="Source and preview side by side, scrolling together (Ctrl+Shift+E)">Split</button>
    </div>
    <button id="open" type="button" title="Open a .tex file (Ctrl+O)">Open</button>
    <button id="arxiv" type="button" title="Search arXiv or import a paper's LaTeX source">arXiv</button>
    <button id="github" type="button" title="Open a .tex file from a public GitHub repository">GitHub</button>
    <button id="preprints" type="button" title="Browse OpenAI's mathematical preprints on GitHub and open one">Preprints</button>
    <input id="file-input" type="file" accept=".tex,.ltx,.latex,text/x-tex,text/plain" hidden>
    <button id="save" type="button" title="Save your changes (Ctrl+S)">Save</button>
    <button id="export" type="button" title="Download the document as a standalone HTML page, math and numbering included">Export</button>
    <button id="print" type="button" title="Print the document, or save it as a PDF, laid out like a paper (Ctrl+P)">Print</button>
    <button id="toc-toggle" type="button" aria-pressed="true" aria-controls="toc-pane" title="Show or hide the table of contents">Contents</button>
    <div class="zoom-group" role="group" aria-label="Zoom">
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Make the document smaller (Ctrl+−)">−</button>
      <button id="zoom-level" class="zoom-level" type="button" title="Reset the zoom to 100% (Ctrl+0)">100%</button>
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Make the document larger (Ctrl++)">+</button>
    </div>
    <button id="find" type="button" title="Search the document (Ctrl+F) or go to a theorem by its number (Ctrl+G)">Find</button>
    <button id="fold-proofs" type="button" aria-pressed="false" title="Fold or unfold every proof">Hide proofs</button>
    <span id="file-name" class="file-name"></span>
    <a id="gh-link" class="gh-link" target="_blank" rel="noopener" hidden title="Make your changes on GitHub, where you can commit them">Edit on GitHub</a>
    <span id="status" class="status" role="status"></span>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to dark theme" title="Switch between light and dark">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main class="panes" id="panes">
    <nav class="toc-pane" id="toc-pane" aria-label="Table of contents" hidden>
      <div class="toc-pane-head">
        <div class="toc-pane-title">Contents</div>
        <button id="toc-side" class="toc-side" type="button" aria-label="Move the contents to the right" title="Move the contents to the right">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path class="toc-side-bar" d="M10.5 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
      </div>
      <ol id="toc-list" class="toc-list"></ol>
    </nav>
    <section class="pane source-pane" id="source-pane" hidden>
      <textarea id="source" spellcheck="false" aria-label="LaTeX source"></textarea>
    </section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the source and preview panes" aria-valuemin="15" aria-valuemax="85" aria-valuenow="50" tabindex="0" title="Drag to resize · double-click to reset" hidden></div>
    <section class="pane preview-pane" id="preview-pane">
      <article id="preview" class="document"></article>
      <div class="add-block-row"><button id="add-block" type="button" class="add-block">+ Add text at the end</button></div>
    </section>
  </main>

  <dialog id="arxiv-dialog" class="arxiv-dialog" aria-labelledby="arxiv-title">
    <form id="arxiv-form" method="dialog">
      <h2 id="arxiv-title">Open from arXiv</h2>
      <label for="arxiv-input">Paste an arXiv link or id, or search by title, author or keywords</label>
      <input id="arxiv-input" type="search" autocomplete="off" spellcheck="false" placeholder="2301.00001, or rough paths signature">
      <p id="arxiv-message" class="arxiv-message" role="status"></p>
      <ol id="arxiv-results" class="preprints-list arxiv-results" hidden></ol>
      <div class="arxiv-actions">
        <button type="button" id="arxiv-cancel">Cancel</button>
        <button type="submit" id="arxiv-go" class="primary">Import</button>
      </div>
    </form>
  </dialog>

  <dialog id="github-dialog" class="arxiv-dialog" aria-labelledby="github-title">
    <form id="github-form" method="dialog">
      <h2 id="github-title">Open from GitHub</h2>
      <label for="github-input">Paste a link to a .tex file, a folder or a repository</label>
      <input id="github-input" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://github.com/owner/repo/blob/main/paper.tex">
      <p id="github-message" class="arxiv-message" role="status"></p>
      <p class="bookmarklet-hint">Drag <a id="bookmarklet" class="bookmarklet" href="#" title="Drag me to your bookmarks bar">Open in TeXglass</a> to your bookmarks bar. Click it on any GitHub page to open that file here.</p>
      <div class="arxiv-actions">
        <button type="button" id="github-cancel">Cancel</button>
        <button type="submit" id="github-go" class="primary">Open</button>
      </div>
    </form>
  </dialog>

  <dialog id="preprints-dialog" class="arxiv-dialog preprints-dialog" aria-labelledby="preprints-title">
    <div class="preprints-head">
      <h2 id="preprints-title">OpenAI math preprints</h2>
      <a id="preprints-repo" class="gh-link" href="https://github.com/openai/math" target="_blank" rel="noopener">openai/math on GitHub</a>
      <button type="button" id="preprints-close" class="preprints-close" aria-label="Close">×</button>
    </div>
    <div class="preprints-filters">
      <input id="preprints-search" type="search" autocomplete="off" spellcheck="false" placeholder="Search titles and abstracts" aria-label="Search the preprints">
      <select id="preprints-discipline" aria-label="Discipline"><option value="">All disciplines</option></select>
    </div>
    <p id="preprints-message" class="arxiv-message" role="status"></p>
    <ol id="preprints-list" class="preprints-list"></ol>
  </dialog>

  <div id="drop-overlay" class="drop-overlay" hidden><div>Drop a .tex file to view it</div></div>
  <div id="ref-popover" class="ref-popover document" role="tooltip" hidden></div>
</body>
</html>
