name: A paper renders badly
description: Something in a LaTeX document or arXiv paper looks wrong or is missing.
body:
  - type: input
    id: source
    attributes:
      label: arXiv id or link
      description: An arXiv id (e.g. 2106.10340) or a public link to the .tex source. Please don't paste unpublished work.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - Web viewer
        - VS Code extension
        - Browser extension (arXiv)
        - Overleaf
        - Command line
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What looks wrong?
      description: The section or equation, what you expected, and a screenshot if you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TeXglass version
      description: Shown in VS Code's extension list or on chrome://extensions. Leave empty for the web viewer.
