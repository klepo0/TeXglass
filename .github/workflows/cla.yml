# Asks first-time contributors to sign the Contributor License Agreement
# (CLA.md) by commenting on their pull request. Signatures are stored in
# signatures/cla.json on the "cla-signatures" branch, so main stays protected.
#
# Security: this runs on pull_request_target, so it has write access even for
# pull requests from forks. It never checks out or runs the pull request's
# code; it only reads comments and pull request metadata.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write # commit signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - name: Make sure the signatures branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches/cla-signatures" --silent 2>/dev/null ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --silent -f ref=refs/heads/cla-signatures \
              -f sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"

      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/klepo0/TeXglass/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: klepo0,dependabot[bot],github-actions[bot],*[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your pull request! Before it can be merged, please
            read the [Contributor License Agreement](https://github.com/klepo0/TeXglass/blob/main/CLA.md)
            and sign it by posting the comment below. You keep the copyright in
            your work; the agreement lets TeXglass offer it under both its
            noncommercial license and commercial licenses. You only sign once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
