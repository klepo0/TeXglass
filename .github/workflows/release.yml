# Publishes a GitHub Release when a version tag is pushed:
#
#   git tag v0.7.1 && git push origin v0.7.1
#
# The tag must match the VS Code extension's version in vscode/package.json.
# The release carries the .vsix and the browser extension zips, with notes
# generated from the pull requests merged since the previous tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # Marketplace trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json

      - name: Check the tag matches the extension version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ext=$(node -p "require('./vscode/package.json').version")
          if [ "$tag" != "$ext" ]; then
            echo "::error::Tag v$tag does not match vscode/package.json version $ext"
            exit 1
          fi

      - name: Install
        run: |
          npm ci
          npm ci --prefix vscode

      - name: Test
        run: |
          npm test
          npm run copy-shared --prefix vscode
          npm test --prefix vscode

      - name: Build the VS Code extension
        working-directory: vscode
        run: npx vsce package -o "../texglass-${GITHUB_REF_NAME#v}.vsix"

      - name: Build the browser extension
        run: node browser/build.js

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="texglass-*.vsix browser/dist/texglass-arxiv-chrome-*.zip browser/dist/texglass-arxiv-firefox-*.zip"
          # On a re-run (e.g. after fixing a publish token) the release exists:
          # replace its files instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "TeXglass $GITHUB_REF_NAME" \
              --generate-notes \
              $files
          fi

      # Trusted publishing: no token. The klepo1 publisher's "Trusted
      # Publishing" tab on marketplace.visualstudio.com/manage must list this
      # repository and workflow (release.yml).
      - name: Publish to the VS Code Marketplace
        working-directory: vscode
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath ../texglass-*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT secret not set; skipping Open VSX"
            exit 0
          fi
          npx --yes ovsx@1.3.0 publish --skip-duplicate --packagePath texglass-*.vsix
